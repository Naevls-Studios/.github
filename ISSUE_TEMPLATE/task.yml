name: 🧰 Task / chore
description: Internal work with no user-facing change, like refactors, tech debt, CI, dependencies, or setup.
title: "[Task]: "
labels: ["chore"]
body:
  - type: textarea
    id: what
    attributes:
      label: What needs to be done?
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Why?
      description: What breaks, slows down, or gets riskier if we don't do it?
    validations:
      required: true

  - type: textarea
    id: done
    attributes:
      label: Definition of done
      placeholder: |
        - [ ] CI runs tests on every PR
        - [ ] README updated with new setup steps

  - type: input
    id: estimate
    attributes:
      label: Rough size
      placeholder: "S (< 1 day) / M (1–3 days) / L (> 3 days, consider splitting)"
